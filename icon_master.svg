<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="reelsMasterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877F2" />
      <stop offset="35%" stop-color="#833AB4" />
      <stop offset="65%" stop-color="#E1306C" />
      <stop offset="100%" stop-color="#FF0000" />
    </linearGradient>
    <filter id="reelsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="116" fill="url(#reelsMasterGradient)" filter="url(#reelsShadow)" />

  <!-- Clapper Line -->
  <line x1="52" y1="175" x2="460" y2="175" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.9" />

  <!-- Film Clapper Stripes -->
  <polygon points="105,173 140,52 175,52 140,173" fill="#ffffff" opacity="0.95" />
  <polygon points="185,173 220,52 255,52 220,173" fill="#ffffff" opacity="0.95" />
  <polygon points="265,173 300,52 335,52 300,173" fill="#ffffff" opacity="0.95" />
  <polygon points="345,173 380,52 415,52 380,173" fill="#ffffff" opacity="0.95" />

  <!-- Center Play Triangle -->
  <polygon points="206,264 206,376 306,320" fill="#ffffff" />

  <!-- Auto-Scroll Loop Arrow -->
  <g transform="translate(365, 375)">
    <path d="M 23 -23 A 34 34 0 1 0 34 8" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" />
    <polygon points="18,-32 38,-12 12,-10" fill="#ffffff" />
  </g>
</svg>
